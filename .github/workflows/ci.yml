name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "VERSION"
      - "README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check LICENSE file
        run: test -f LICENSE || (echo "::error::LICENSE file is missing" && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          github-token: ${{ secrets.GH_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out -json ./... | tee test-results.json

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep ^total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE} < 80) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

      - name: Publish test results
        if: always()
        uses: jedi-knights/publish-test-results@v0.3.0
        with:
          files: test-results.json
          check-name: Test Results

  e2e:
    name: E2E (real Neovim)
    runs-on: ubuntu-latest
    # Timeout is generous — the download + tar + a single nvim run
    # takes well under 2 minutes in practice, but 10 gives headroom
    # for GitHub runner variance.
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Neovim install: pinned tag rather than `stable` so CI is
      # reproducible across upstream releases. Bump the tag here (and
      # the tarball asset name if upstream rearranges it) when we
      # want a newer runtime; no other CI-side changes needed. The
      # 0.10 line is what neospec's harness requires (uses vim.uv).
      #
      # Note: upstream renamed the tarball from nvim-linux64.tar.gz
      # to nvim-linux-x86_64.tar.gz at v0.10.4. The extracted
      # directory follows the same naming.
      - name: Install Neovim v0.10.4
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-x86_64.tar.gz \
            -o /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # Log the version so a future upstream break is obvious in the
      # run output rather than manifesting as a mysterious test
      # failure downstream.
      - name: Verify Neovim
        run: nvim --version

      # plenary.nvim is required by the cover-mode E2E test
      # (TestBranchInstrumentation_TrueE2E_CoverMode) — it drives the
      # RunnerPlenaryBusted code path against real plenary. Cloned to
      # /tmp/plenary.nvim which is the default the test looks for;
      # override via NEOSPEC_E2E_PLENARY if a different location is
      # ever needed. --depth 1 keeps the download fast; if a specific
      # plenary revision becomes load-bearing, pin via commit SHA
      # here rather than upstream tag (plenary tags rarely).
      - name: Install plenary.nvim
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git /tmp/plenary.nvim
          (cd /tmp/plenary.nvim && git log -1 --oneline)

      # Every TestBranchInstrumentation_TrueE2E* test — currently the
      # require-loaded and dofile-loaded variants. Prefix pattern
      # picks up future E2E siblings automatically (short-circuit,
      # implicit-arm) once they land. The scripted integration test
      # that covers the same pipeline without needing Neovim already
      # ran in the `test` job.
      - name: Run E2E tests
        env:
          NEOSPEC_E2E: "1"
        run: |
          go test -race -count=1 \
            -run '^TestBranchInstrumentation_TrueE2E' \
            ./internal/adapters/cover/...
